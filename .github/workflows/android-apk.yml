name: Build Native Android App (Play Store .aab & .apk)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Signed Google Play AAB & APK
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 3. Setup Java 21 (Required for Android Gradle Build)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 4. Install Capacitor & Generate Native Android Project
        run: |
          npm install
          npm run prepare-www
          npx cap add android
          npx cap sync android

      - name: 4.1. Apply Custom Tibetan Account Book Launcher Icons
        run: |
          if [ -f "app-icon.png" ]; then
            sudo apt-get update && sudo apt-get install -y imagemagick
            convert app-icon.png -resize 48x48 android/app/src/main/res/mipmap-mdpi/ic_launcher.png
            convert app-icon.png -resize 48x48 android/app/src/main/res/mipmap-mdpi/ic_launcher_round.png
            convert app-icon.png -resize 108x108 android/app/src/main/res/mipmap-mdpi/ic_launcher_foreground.png
            convert app-icon.png -resize 72x72 android/app/src/main/res/mipmap-hdpi/ic_launcher.png
            convert app-icon.png -resize 72x72 android/app/src/main/res/mipmap-hdpi/ic_launcher_round.png
            convert app-icon.png -resize 162x162 android/app/src/main/res/mipmap-hdpi/ic_launcher_foreground.png
            convert app-icon.png -resize 96x96 android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
            convert app-icon.png -resize 96x96 android/app/src/main/res/mipmap-xhdpi/ic_launcher_round.png
            convert app-icon.png -resize 216x216 android/app/src/main/res/mipmap-xhdpi/ic_launcher_foreground.png
            convert app-icon.png -resize 144x144 android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
            convert app-icon.png -resize 144x144 android/app/src/main/res/mipmap-xxhdpi/ic_launcher_round.png
            convert app-icon.png -resize 324x324 android/app/src/main/res/mipmap-xxhdpi/ic_launcher_foreground.png
            convert app-icon.png -resize 192x192 android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
            convert app-icon.png -resize 192x192 android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png
            convert app-icon.png -resize 432x432 android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_foreground.png
            echo "Custom Tibetan Account Book launcher icons generated!"
          fi

      - name: 4.2. Lock Screen Orientation to Portrait & Set Version
        run: |
          node -e '
            const fs = require("fs");
            const mf = "android/app/src/main/AndroidManifest.xml";
            if (fs.existsSync(mf)) {
              let c = fs.readFileSync(mf, "utf8");
              if (!c.includes("android:screenOrientation=\"portrait\"")) {
                c = c.replace("<activity", "<activity android:screenOrientation=\"portrait\"");
                fs.writeFileSync(mf, c, "utf8");
                console.log("Locked Android screenOrientation to portrait in AndroidManifest.xml");
              }
            }
          '

      - name: 4.3. Configure Release Keystore & Signing in build.gradle
        run: |
          if [ ! -f "release-keystore.jks" ]; then
            keytool -genkeypair -v \
              -keystore release-keystore.jks \
              -alias tibetanaccountbook \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass TibetanAccount2026! \
              -keypass TibetanAccount2026! \
              -dname "CN=Tenzin Tendar, OU=Community, O=Tibetan Account Book, L=Dharamshala, ST=HP, C=IN"
          fi
          cp release-keystore.jks android/app/release-keystore.jks

          node -e '
            const fs = require("fs");
            const bgPath = "android/app/build.gradle";
            let bg = fs.readFileSync(bgPath, "utf8");
            bg = bg.replace("versionCode 1", "versionCode 2");
            bg = bg.replace("versionName \"1.0\"", "versionName \"2.0.0\"");
            const signingBlock = `
                signingConfigs {
                    release {
                        storeFile file("release-keystore.jks")
                        storePassword "TibetanAccount2026!"
                        keyAlias "tibetanaccountbook"
                        keyPassword "TibetanAccount2026!"
                    }
                }
                buildTypes {
                    release {
                        signingConfig signingConfigs.release
                        minifyEnabled false
                        proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
                    }
                }
            `;
            bg = bg.replace(/buildTypes\s*\{[\s\S]*?\n\s*\}/, signingBlock.trim());
            fs.writeFileSync(bgPath, bg, "utf8");
            console.log("Configured release signing in android/app/build.gradle");
          '

      - name: 5. Build Signed Google Play App Bundle (.aab) & Installable APK (.apk)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease assembleRelease
          cp app/build/outputs/bundle/release/app-release.aab ../Tibetan-Account-Book-PlayStore.aab
          cp app/build/outputs/apk/release/app-release.apk ../Tibetan-Account-Book-Android.apk

      - name: 6. Upload Google Play Store AAB & APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Tibetan-Account-Book-GooglePlay-Bundle
          path: |
            Tibetan-Account-Book-PlayStore.aab
            Tibetan-Account-Book-Android.apk
            release-keystore.jks
          retention-days: 90
